[project]
name = "searinks"
version = "0.1.0"
description = "Seattle-area ice rink schedules"
readme = "README.md"
authors = [
    { name = "Anne", email = "annexie1999@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
searinks = "searinks.cli:main"
searinks-export = "searinks.export:main"
searinks-prune = "searinks.prune:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
