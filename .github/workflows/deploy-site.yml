# Builds web/ with the data branch's files and publishes it to GitHub Pages. Never calls the rink APIs.
name: deploy-site

on:
  # Pushes made with GITHUB_TOKEN don't trigger push workflows, so a fetch-data run is the link.
  # fetch-data only runs on main (schedule, push, dispatch), never on pull requests, and this
  # workflow checks out main rather than anything from the triggering run.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [fetch-data]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load data
        run: |
          sha=$(.github/scripts/load-data.sh)
          if [ -z "$sha" ]; then
            echo "::error::No data branch yet; run fetch-data first"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
