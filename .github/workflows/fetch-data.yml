# The only workflow that calls the rinks' schedule APIs. Saves the export to the data branch;
# deploy-site publishes it.
name: fetch-data

on:
  schedule:
    - cron: "0 13 * * 1,4" # Monday and Thursday, 6am PDT / 5am PST
  push:
    branches: [main]
    paths:
      - "src/searinks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/fetch-data.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the data branch
    steps:
      # Credentials stay configured so save-data.sh can push; nothing from this job is uploaded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Load previous data
        id: load
        run: |
          sha=$(.github/scripts/load-data.sh)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # A rink that fails keeps its previous files, so partial results are still saved below.
      # Exit 1 means a bug on our side, 2 that every rink's API failed; either fails the job
      # after saving.
      - name: Export schedules
        id: export
        run: |
          set +e
          uv run --locked searinks-export
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Prune past days
        run: uv run --locked searinks-prune

      - name: Save to data branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          DATA_SHA: ${{ steps.load.outputs.sha }}
        run: .github/scripts/save-data.sh "$DATA_SHA"

      - name: Fail if the export failed
        if: steps.export.outputs.code != '0'
        env:
          CODE: ${{ steps.export.outputs.code }}
        run: |
          echo "::error::searinks-export exited $CODE"
          exit 1
